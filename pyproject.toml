[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "he3-cryo-extractor"
version = "1.0.0"
description = "First-Principles Exergy and Economic Audit of Terrestrial Helium-3 Production and Cryogenic Harvesting"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

